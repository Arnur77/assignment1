<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table and Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Student Grades & Feedback</h1>
</header>

<nav class="navbar">
    <a href="index.html">Task 1</a>
    <a href="task2.html">Task 2</a>
    <a href="task3.html">Task 3</a>
    <a href="task4.html">Task 4</a>
    <a href="task5.html">Task 5</a>
</nav>

<main class="content">
    <section class="card table-container">
        <h2 id="table-heading">Student Grades</h2>
        <table class="grades">
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
            <tr>
                <td>Arnur</td>
                <td>Web Development</td>
                <td>92</td>
            </tr>
            <tr class="highlight-row">
                <td>Student A</td>
                <td>Database Systems</td>
                <td>95</td>
            </tr>
            <tr>
                <td>Student B</td>
                <td>Java OOP</td>
                <td>88</td>
            </tr>
            <tr>
                <td rowspan="2">Student C</td>
                <td>Algorithms</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Political Science</td>
                <td>84</td>
            </tr>
        </table>
    </section>

    <section class="card">
        <h2>Feedback Form</h2>
        <form class="form-box" action="#" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" type="text" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role">
                    <option>Student</option>
                    <option>Teacher</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group radio-group">
                <label>Did you like the website?</label>
                <label><input type="radio" name="answer" value="yes"> Yes</label>
                <label><input type="radio" name="answer" value="no"> No</label>
            </div>

            <div class="form-group">
                <label for="comments">Comments</label>
                <textarea id="comments" name="comments" placeholder="Write your comments"></textarea>
            </div>

            <button id="submit-button" class="submit-btn" type="submit">Submit Feedback</button>
        </form>
    </section>
</main>

<footer>© 2026 Arnur — Task 4</footer>
</body>
</html>
